name: Build Quick Water APK

on:
  workflow_dispatch:
  push:
    branches:
      - quick-water-app-v0.1
    paths:
      - 'quick-water-v03-src/**'
      - '.github/workflows/build-quick-water-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild v0.3 source archive
        shell: bash
        run: |
          cat quick-water-v03-src/chunk*.b64 > /tmp/quick-water-v03.b64
          base64 --decode /tmp/quick-water-v03.b64 > /tmp/quick-water-v03.zip
          unzip -t /tmp/quick-water-v03.zip
          mkdir -p /tmp/quick-water-v03
          unzip -q /tmp/quick-water-v03.zip -d /tmp/quick-water-v03
          printf 'android.useAndroidX=true\n' > /tmp/quick-water-v03/ShopeeQuickWaterApp_v03/gradle.properties

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME/platforms" | tail -20 || true
          ls -1 "$ANDROID_HOME/build-tools" | tail -20 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/quick-water-v03/ShopeeQuickWaterApp_v03
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopeeQuickWater-v0.3-debug
          path: /tmp/quick-water-v03/ShopeeQuickWaterApp_v03/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
