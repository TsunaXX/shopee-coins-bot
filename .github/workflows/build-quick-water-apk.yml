name: Build Quick Water APK

on:
  workflow_dispatch:
  push:
    branches:
      - quick-water-app-v0.1
    paths:
      - 'quick-water-v04-src/**'
      - 'quick-water-v05-overrides/**'
      - '.github/workflows/build-quick-water-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild v0.4 source archive
        shell: bash
        run: |
          cat quick-water-v04-src/chunk*.b64 > /tmp/quick-water-v04.b64
          base64 --decode /tmp/quick-water-v04.b64 > /tmp/quick-water-v04.zip
          unzip -t /tmp/quick-water-v04.zip
          mkdir -p /tmp/quick-water-v05
          unzip -q /tmp/quick-water-v04.zip -d /tmp/quick-water-v05

      - name: Apply v0.5 Final theme patch
        run: python quick-water-v05-overrides/patch_v05.py /tmp/quick-water-v05/ShopeeQuickWaterApp_v04

      - name: Apply v0.5.1 light-theme fix
        run: python quick-water-v05-overrides/patch_v051.py /tmp/quick-water-v05/ShopeeQuickWaterApp_v04

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable debug signing key
        id: signing-key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: quick-water-stable-debug-keystore-v1

      - name: Create stable debug signing key
        if: steps.signing-key.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey             -keypass android             -dname "CN=Android Debug,O=Quick Water,C=TW"             -keyalg RSA -keysize 2048 -validity 10000

      - name: Check preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME/platforms" | tail -20 || true
          ls -1 "$ANDROID_HOME/build-tools" | tail -20 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build V0.5.1 Final APK
        working-directory: /tmp/quick-water-v05/ShopeeQuickWaterApp_v04
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopeeQuickWater-v0.5.1-Final
          path: /tmp/quick-water-v05/ShopeeQuickWaterApp_v04/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
